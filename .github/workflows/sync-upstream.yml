# Fork-only: merges benjaminLedel/covey main into this fork's main once a week.
# A merge rather than a fast-forward, because this file is a commit upstream
# does not have. If the merge conflicts the job fails and nothing is pushed.
# If upstream changes anything under .github/workflows/, GITHUB_TOKEN cannot push
# it — use a personal access token with the `workflow` scope as SYNC_TOKEN.
name: Sync upstream

on:
  schedule:
    - cron: "17 5 * * 1"   # Mondays, 05:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    # Only meaningful in the fork; a no-op if this file is ever merged upstream.
    if: github.repository == 'nirosh-7edu/covey'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN || github.token }}
      - name: Merge upstream main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/benjaminLedel/covey.git
          git fetch upstream main
          git merge --no-edit upstream/main
          git push origin HEAD:main
